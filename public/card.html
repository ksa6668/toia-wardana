<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>بطاقة الولاء</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!--
    صفحة البطاقة العامة /c/{token} — مستقلة تماماً عن التطبيق:
    بلا React، بلا Firebase client، بلا مصادقة، وبلا localStorage.
    البيانات من /api/card فقط (قائمة حقول بيضاء — لا جوال كامل ولا سجلات).
    الشعارات ملفات منفصلة (logo-toia.svg / logo-wardana.svg) قابلة للاستبدال.
  -->
  <style>
    :root {
      --primary: #113293;      /* تويا افتراضياً — يُبدَّل حسب المتجر */
      --accent:  #F5B08C;
      --surface: #FFFFFF;
      --page:    #F4F6FB;
      --text:    #1B2440;
      --muted:   #6B7690;
      --line:    #E4E9F3;
    }
    .store-wardana {
      --primary: #357575;
      --accent:  #C9A227;
      --surface: #FFFDF7;
      --page:    #F3F6F2;
      --text:    #223A38;
      --muted:   #6E807D;
      --line:    #E2E8DF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--page);
      font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100%;
    }
    .wrap { max-width: 430px; margin: 0 auto; padding: 16px 14px 40px; }

    /* ===== حالات التحميل والخطأ ===== */
    .center { text-align: center; padding: 90px 20px; color: var(--muted); }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 14px;
      border: 3px solid var(--line); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-icon { font-size: 40px; margin-bottom: 12px; }
    .err-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .err-sub { font-size: 13px; font-weight: 500; }

    /* ===== البطاقة ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.07);
    }
    .card-top {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px 12px;
      display: flex; align-items: center; gap: 8px;
    }
    /* dir=rtl: العنصر الأول يظهر يميناً — الرصيد يمين، الفئة وسط، الشعار يسار */
    .top-balance { flex: 1; text-align: right; }
    .top-balance .num { font-size: 22px; font-weight: 800; line-height: 1; }
    .top-balance .lbl { font-size: 10px; opacity: 0.85; font-weight: 600; }
    .top-tier { flex: 1; text-align: center; }
    .tier-chip {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 800; background: rgba(255,255,255,0.16);
    }
    .tier-silver   { color: #E8EDF5; }
    .tier-gold     { color: #FFD873; }
    .tier-platinum { color: #D9CCFF; }
    .top-store { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
    /* الشعار الرسمي طولي (تويا 558×862 / وردانة 664×871) — contain يمنع الانضغاط،
       ويُعرض مباشرة على خلفية الهيدر الملوّنة (الخوخي/العاجي فاتحان فيبرزان عليها) */
    .top-store img { width: 34px; height: 34px; object-fit: contain; }
    .top-store .sname { font-size: 13px; font-weight: 800; }

    .member-name {
      text-align: center; font-size: 22px; font-weight: 800;
      padding: 20px 16px 4px;
    }

    /* ===== QR ===== */
    .qr-sec { text-align: center; padding: 14px 16px 20px; }
    .qr-box {
      display: inline-block; padding: 10px; background: #fff;
      border: 1px solid var(--line); border-radius: 16px;
    }
    .qr-box svg { display: block; width: 190px; height: 190px; }
    .member-no { font-size: 17px; font-weight: 800; letter-spacing: 1px; margin-top: 10px; direction: ltr; }
    .qr-hint { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 3px; }

    /* ===== التفاصيل ===== */
    .details {
      margin-top: 14px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px;
    }
    .details h3 { font-size: 13px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .drow {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--line);
    }
    .drow:last-of-type { border-bottom: none; }
    .drow .k { color: var(--muted); font-weight: 600; }
    .drow .v { font-weight: 800; }
    .terms {
      margin-top: 10px; font-size: 11px; color: var(--muted);
      font-weight: 500; line-height: 1.8;
      border-top: 1px solid var(--line); padding-top: 10px;
    }
    .foot { text-align: center; font-size: 10.5px; color: var(--muted); margin-top: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="center" id="loading">
      <div class="spinner"></div>
      <p style="font-size:13px;font-weight:700">جارٍ تحميل البطاقة...</p>
    </div>
  </div>

  <script src="/qrcode-generator.js"></script>
  <script>
    (function () {
      var app = document.getElementById('app');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function showError(title, sub) {
        app.innerHTML =
          '<div class="center">' +
          '<div class="err-icon">🌸</div>' +
          '<p class="err-title">' + esc(title) + '</p>' +
          '<p class="err-sub">' + esc(sub || '') + '</p>' +
          '</div>';
      }

      // التوكن من المسار /c/{token} (أو ?token= احتياطاً)
      var m = location.pathname.match(/\/c\/([A-Za-z0-9]+)/);
      var token = (m && m[1]) || new URLSearchParams(location.search).get('token') || '';
      if (!token) {
        showError('البطاقة غير متوفرة', 'تأكد من فتح الرابط كاملاً كما وصلك');
        return;
      }

      // هللات → نص بالريال (375 → "3.75"، ‏400 → "4") — عرض فقط
      function fmtSAR(halalas) {
        var h = Math.round(Number(halalas) || 0);
        var sign = h < 0 ? '-' : '';
        var abs = Math.abs(h);
        var whole = Math.floor(abs / 100);
        var frac = abs % 100;
        if (!frac) return sign + whole.toLocaleString('en-US');
        return sign + whole.toLocaleString('en-US') + '.' + String(frac < 10 ? '0' + frac : frac);
      }

      function render(d) {
        if (d.store === 'wardana') document.documentElement.classList.add('store-wardana');
        document.title = 'بطاقة الولاء — ' + d.storeName;
        var logo = d.store === 'wardana' ? '/logo-wardana.svg' : '/logo-toia.svg';
        var tierCls = d.tier ? 'tier-' + esc(d.tier.key) : '';
        // النسخة 3.0: اسم الفئة صار {ar,en} — العرض عربي هنا (المرحلة B: بلغة العميل)
        var tierName = d.tier
          ? (d.tier.name && typeof d.tier.name === 'object' ? (d.tier.name.ar || d.tier.name.en || 'عضو') : d.tier.name)
          : 'عضو';

        var html =
          '<div class="card">' +
            '<div class="card-top">' +
              '<div class="top-balance"><div class="num">' + fmtSAR(d.balanceHalalas) + '</div><div class="lbl">الرصيد (ريال)</div></div>' +
              '<div class="top-tier"><span class="tier-chip ' + tierCls + '">' + esc(tierName) + '</span></div>' +
              '<div class="top-store"><span class="sname">' + esc(d.storeName) + '</span><img src="' + logo + '" alt="' + esc(d.storeName) + '" /></div>' +
            '</div>' +
            '<div class="member-name">' + esc(d.name) + '</div>' +
            '<div class="qr-sec">' +
              '<div class="qr-box" id="qr"></div>' +
              '<div class="member-no">' + esc(d.memberNo) + '</div>' +
              '<div class="qr-hint">امسح الرمز عند الدفع</div>' +
            '</div>' +
          '</div>' +
          '<div class="details">' +
            '<h3>تفاصيل العضوية</h3>' +
            '<div class="drow"><span class="k">الجوال</span><span class="v" dir="ltr">' + esc(d.phoneMasked) + '</span></div>' +
            '<div class="drow"><span class="k">تاريخ الانضمام</span><span class="v" dir="ltr">' + esc(d.joinedAt || '—') + '</span></div>' +
            '<div class="drow"><span class="k">انتهاء الرصيد</span><span class="v" dir="ltr">' + esc(d.balanceExpiresAt || '—') + '</span></div>' +
            '<p class="terms">' +
              // expiryMonths من loyaltySettings عبر /api/card — لا رقم ثابت هنا
              'يُحتسب رصيدك بالريال على مشترياتك من ' + esc(d.storeName) + ' وينتهي تلقائياً بعد ' +
              esc(d.expiryMonths != null ? d.expiryMonths : '—') + ' شهراً من آخر عملية شراء. ' +
              'استخدام الرصيد يتم داخل الفرع بطلبك عند الدفع بإبراز البطاقة أو برقم الجوال. ' +
              'البرنامج خاضع للشروط والأحكام وقد تتغير النسب حسب سياسة المتجر.' +
              '<br/>للاستفسار: تفضّل بزيارة ' + esc(d.storeName) + ' أو تواصل عبر قنوات المتجر الرسمية.' +
            '</p>' +
          '</div>' +
          '<p class="foot">برنامج ولاء ' + esc(d.storeName) + '</p>';

        app.innerHTML = html;

        // QR كبير يحمل رقم العضوية (qrcode-generator — ملف مورّد MIT)
        try {
          var qr = qrcode(0, 'M');
          qr.addData(String(d.memberNo || ''));
          qr.make();
          document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 5, margin: 0, scalable: true });
        } catch (e) {
          document.getElementById('qr').innerHTML =
            '<p style="font-size:12px;color:var(--muted);padding:20px">تعذّر توليد الرمز</p>';
        }
      }

      // ثلاث حالات خطأ متمايزة: 404 (بطاقة غير موجودة) / 5xx (خطأ خادم) / فشل شبكة
      fetch('/api/card?token=' + encodeURIComponent(token))
        .then(function (res) {
          if (res.status === 404) throw { kind: 'notfound', status: 404 };
          if (res.status === 429) throw { kind: 'rate', status: 429 };
          if (res.status >= 500) throw { kind: 'server', status: res.status };
          if (!res.ok) throw { kind: 'server', status: res.status };
          return res.json();
        })
        .then(render)
        .catch(function (err) {
          console.error('Card load error:', err && err.kind ? ('HTTP ' + err.status + ' (' + err.kind + ')') : err);
          if (err && err.kind === 'notfound') {
            showError('البطاقة غير متوفرة', 'تأكد من صحة الرابط أو راجع الفرع');
          } else if (err && err.kind === 'rate') {
            showError('طلبات كثيرة', 'أعد المحاولة بعد قليل');
          } else if (err && err.kind === 'server') {
            showError('خطأ في الخادم', 'حدث خلل مؤقت لدينا — أعد المحاولة بعد قليل، وإن استمر فأبلغ الفرع');
          } else {
            showError('تعذّر الاتصال', 'تحقق من اتصالك بالإنترنت ثم أعد المحاولة');
          }
        });
    })();
  </script>
</body>
</html>
