<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- شعار مؤقت لمتجر وردانة — وردة بلون الهوية #357575 مع عاجي وذهبي.
       يُستبدل لاحقاً بالشعار الرسمي بتغيير هذا الملف فقط. -->
  <circle cx="50" cy="50" r="48" fill="#357575"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#C9A227" stroke-width="1.6" opacity="0.9"/>
  <!-- بتلات وردة (خمس بتلات عاجية) -->
  <g fill="#FFF6E8">
    <ellipse cx="50" cy="30" rx="11" ry="14" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="30" rx="11" ry="14" transform="rotate(72 50 50)"/>
    <ellipse cx="50" cy="30" rx="11" ry="14" transform="rotate(144 50 50)"/>
    <ellipse cx="50" cy="30" rx="11" ry="14" transform="rotate(216 50 50)"/>
    <ellipse cx="50" cy="30" rx="11" ry="14" transform="rotate(288 50 50)"/>
  </g>
  <!-- طبقة بتلات داخلية ذهبية -->
  <g fill="#C9A227" opacity="0.55">
    <ellipse cx="50" cy="38" rx="7" ry="9" transform="rotate(36 50 50)"/>
    <ellipse cx="50" cy="38" rx="7" ry="9" transform="rotate(108 50 50)"/>
    <ellipse cx="50" cy="38" rx="7" ry="9" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="38" rx="7" ry="9" transform="rotate(252 50 50)"/>
    <ellipse cx="50" cy="38" rx="7" ry="9" transform="rotate(324 50 50)"/>
  </g>
  <!-- قلب الوردة -->
  <circle cx="50" cy="50" r="8.5" fill="#FFF6E8"/>
  <circle cx="50" cy="50" r="4.5" fill="#C9A227"/>
</svg>
